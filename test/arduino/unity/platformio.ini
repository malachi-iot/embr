[platformio]
lib_dir = ../scheduler/lib

[env]
framework = arduino
check_skip_packages = yes
# FIX: Since we no longer use submodule, need to update estd
#lib_deps = malachi-iot/estdlib@^0.8.9
lib_deps = https://github.com/malachi-iot/estdlib.git#v0.8.10-alpha1


[env:uno]
platform = atmelavr
board = uno
build_unflags = -std=gnu++11
build_flags = ${env.build_flags} -std=c++17

[env:promicro]
platform = atmelavr
board = micro
build_unflags = -std=gnu++11
build_flags = ${env.build_flags} -std=c++17

[env:attiny]
platform = atmelavr
board = attiny85

[env:m0]
platform = atmelsam
board = adafruit_feather_m0

[env:esp32]
platform = espressif32
board = wemos_d1_mini32
monitor_speed = 115200
